<div class="flex flex-col gap-8">
  <app-auth-form-header
    title="Inicia sesión"
    subtitle="Continúa donde lo dejaste: tu biblioteca, tus reseñas y tus listas te esperan."
  />

  <app-form-alert [messages]="apiErrors()" />

  <form
    class="flex flex-col gap-5"
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <app-form-field label="Email" inputId="login-email" [error]="fieldError('email')">
      <input
        id="login-email"
        class="vault-input"
        type="email"
        autocomplete="email"
        placeholder="tu@email.com"
        formControlName="email"
        [attr.aria-invalid]="!!fieldError('email')"
      />
    </app-form-field>

    <app-form-field
      label="Contraseña"
      inputId="login-password"
      [error]="fieldError('password')"
    >
      <input
        #passwordInput
        id="login-password"
        class="vault-input pr-12"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
        formControlName="password"
        [attr.aria-invalid]="!!fieldError('password')"
      />
      <app-password-toggle [target]="passwordInput" />
    </app-form-field>

    <button
      vaultButton
      size="lg"
      type="submit"
      class="mt-2"
      [fullWidth]="true"
      [disabled]="isLoading()"
    >
      @if (isLoading()) {
        <span class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent" aria-hidden="true"></span>
        Entrando...
      } @else {
        Entrar
        <span aria-hidden="true">→</span>
      }
    </button>
  </form>

  <p class="text-center text-sm text-vault-muted">
    ¿Todavía no tienes cuenta?
    <a
      class="font-semibold text-vault-accent transition hover:text-vault-accent-soft"
      routerLink="/auth/register"
      >Crea una gratis</a
    >
  </p>
</div>
