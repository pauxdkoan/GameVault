<section class="scroll-mt-24" [id]="sectionId()">
  <app-section-header
    [title]="title()"
    [subtitle]="subtitle()"
    linkLabel="Ver todos los juegos"
    linkRoute="/gamevault/games"
  />

  <div class="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-6">
    @for (game of visibleGames(); track game.id; let index = $index) {
      <app-game-card
        [game]="game"
        [previewSide]="(index + 1) % 6 === 0 || (index + 1) % 6 === 5 ? 'left' : 'right'"
      />
    }
  </div>
</section>
