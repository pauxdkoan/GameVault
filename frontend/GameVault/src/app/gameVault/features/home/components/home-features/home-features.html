<section id="features" class="scroll-mt-24">
  <app-section-header
    title="Mucho más que un catálogo"
    subtitle="Todo lo que necesitas para vivir tus juegos, en un mismo sitio."
  />

  <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (feature of features; track feature.title; let index = $index) {
      <article class="vault-card group relative overflow-hidden p-6 transition duration-300 hover:-translate-y-1 hover:border-vault-cyan/40">
        <div class="absolute -right-10 -top-10 size-32 rounded-full bg-vault-cyan/0 blur-2xl transition group-hover:bg-vault-cyan/15" aria-hidden="true"></div>
        <span
          class="grid size-11 place-items-center rounded-xl border"
          [class]="index % 2 === 0 ? 'border-vault-cyan/25 bg-vault-cyan/10 text-vault-cyan' : 'border-vault-violet/25 bg-vault-violet/10 text-vault-violet'"
          aria-hidden="true"
        >
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="feature.iconPath" /></svg>
        </span>
        <h3 class="mt-5 font-display text-base font-bold text-vault-text">{{ feature.title }}</h3>
        <p class="mt-2 text-sm leading-6 text-vault-muted">{{ feature.description }}</p>
      </article>
    }
  </div>
</section>
