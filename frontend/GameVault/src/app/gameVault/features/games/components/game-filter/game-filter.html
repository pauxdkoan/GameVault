<div class="grid gap-5">
  <form
    class="flex min-h-12 overflow-hidden rounded-md border border-vault-border bg-vault-bg-soft transition focus-within:border-vault-accent focus-within:ring-[3px] focus-within:ring-vault-accent/20"
    (submit)="applySearch($event)"
  >
    <label class="sr-only" for="game-search">Buscar juego</label>
    <div class="flex flex-1 items-center gap-3 px-4">
      <app-icon name="search" class="size-4 text-vault-muted" />
      <input
        id="game-search"
        class="h-full w-full min-w-0 bg-transparent text-base text-vault-text outline-none placeholder:text-vault-subtle"
        type="search"
        placeholder="Buscar por nombre"
        [value]="search()"
        (input)="onSearchInput($event)"
      />
    </div>
    <button
      class="flex shrink-0 items-center justify-center gap-2 bg-vault-accent px-4 text-sm font-bold text-vault-bg transition hover:bg-vault-accent-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-vault-bg cursor-pointer sm:min-w-32 sm:px-5"
      type="submit"
    >
      Buscar
      <app-icon name="arrow-right" class="size-4" />
    </button>
  </form>

  <div
    class="-mx-4 flex flex-wrap items-center gap-2 border-y border-vault-border px-4 py-3 sm:mx-0 sm:px-0"
  >
    @for (group of filterGroups(); track group.key) {
      <div class="relative">
        <button
          class="flex min-h-10 items-center gap-2 rounded-md border border-vault-border bg-vault-bg-soft px-3 text-sm font-semibold text-vault-text transition hover:border-vault-border-strong cursor-pointer"
          type="button"
          (click)="toggleFilterGroup(group)"
        >
          {{ group.title }}
          @if (selectedCount(group) > 0 && group.key !== "sort") {
            <span class="rounded-sm bg-vault-accent px-1.5 text-xs font-bold tabular-nums text-vault-bg">
              {{ selectedCount(group) }}
            </span>
          }
          <app-icon
            name="chevron-down"
            class="size-3.5 text-vault-muted transition"
            [class.rotate-180]="isGroupOpen(group)"
          />
        </button>

        @if (isGroupOpen(group)) {
          <div
            class="vault-popover absolute left-0 z-20 mt-2 grid min-w-56 gap-1 rounded-xl p-2"
          >
            @for (option of group.options; track option.label) {
              <button
                [class]="
                  isActiveOption(group, option)
                    ? 'flex w-full items-center justify-between gap-4 rounded-md bg-vault-accent px-3 py-2 text-left text-sm font-bold text-vault-bg cursor-pointer'
                    : 'flex w-full items-center justify-between gap-4 rounded-md px-3 py-2 text-left text-sm font-semibold text-vault-muted transition hover:bg-vault-surface-hover hover:text-vault-text cursor-pointer'
                "
                type="button"
                (click)="selectOption(group, option)"
              >
                <span>{{ option.label }}</span>
                @if (isActiveOption(group, option)) {
                  <app-icon name="check" class="size-3.5" [strokeWidth]="3" />
                }
              </button>
            }
          </div>
        }
      </div>
    }

    @for (chip of selectedChips(); track chip.key + "-" + chip.label) {
      <span
        class="flex min-h-10 items-center gap-2 rounded-md border border-vault-accent/60 px-3 text-sm font-semibold text-vault-text"
      >
        {{ chip.label }}
        <button
          class="grid size-6 place-items-center rounded-sm text-vault-muted transition hover:bg-vault-surface-hover hover:text-vault-text cursor-pointer"
          type="button"
          (click)="removeChip(chip)"
          [attr.aria-label]="'Quitar ' + chip.label"
        >
          <app-icon name="x" class="size-3" [strokeWidth]="2.5" />
        </button>
      </span>
    }
  </div>
</div>
