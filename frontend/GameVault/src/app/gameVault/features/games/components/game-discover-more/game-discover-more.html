@if (sections().length > 0) {
  <section class="vault-card p-5">
    <div class="space-y-6">
      @for (section of sections(); track section.title) {
        <div>
          <div class="mb-3">
            <h2 class="text-2xl text-vault-text">{{ section.title }}</h2>
            <p class="mt-1 text-sm text-vault-muted">
              {{ section.subtitle }}
            </p>
          </div>

          <swiper-container
            class="block pb-4"
            slides-per-view="auto"
            space-between="12"
            free-mode="true"
            grab-cursor="true"
            speed="450"
          >
            @for (game of section.games; track game.id) {
              <swiper-slide class="w-24">
                <app-game-card
                  [game]="game"
                  variant="compact"
                  previewMode="external"
                  (previewOpen)="showGamePreview(game, $event)"
                  (previewClose)="scheduleClosePreview()"
                />
              </swiper-slide>
            }
          </swiper-container>
        </div>
      }
    </div>

    @if (activePreview(); as preview) {
      <div
        class="fixed z-[100] w-80"
        [style.top.px]="preview.top"
        [style.left.px]="preview.left"
        (mouseenter)="cancelClosePreview()"
        (mouseleave)="scheduleClosePreview()"
      >
        <app-game-card-preview [game]="preview.game" variant="compact" />
      </div>
    }
  </section>
}
